[workspace]
members = [
  "shardloom-core",
  "shardloom-vortex",
  "shardloom-plan",
  "shardloom-exec",
  "shardloom-cli",
  "shardloom-python",
  "shardloom-contract-tests",
]
exclude = ["vendor/arrow-pyarrow", "vendor/vortex-array", "vendor/vortex-datetime-parts", "vendor/vortex-layout", "vendor/vortex-zstd"]
resolver = "2"

[patch.crates-io]
arrow-pyarrow = { path = "vendor/arrow-pyarrow" }
vortex-array = { path = "vendor/vortex-array" }
vortex-datetime-parts = { path = "vendor/vortex-datetime-parts" }
vortex-layout = { path = "vendor/vortex-layout" }
vortex-zstd = { path = "vendor/vortex-zstd" }

[workspace.package]
version = "0.6.0"
edition = "2024"
description = "Pre-release Vortex-first no-fallback local compute engine with evidence-certified workflows."
license = "Apache-2.0"
homepage = "https://shardloom.io"
repository = "https://github.com/depsilon/shardloom"
documentation = "https://github.com/depsilon/shardloom/tree/main/docs"
readme = "README.md"
keywords = ["analytics", "columnar", "vortex", "etl", "no-fallback"]
categories = ["command-line-utilities", "database", "encoding", "science"]
rust-version = "1.96"

[workspace.dependencies]
arrow-array = "58.3.0"
arrow-avro = { version = "58.3.0", default-features = false, features = ["deflate", "snappy"] }
arrow-ipc = "58.3.0"
arrow-pyarrow = "=58.3.0"
arrow-schema = "58.3.0"
futures = "0.3.34"
flatbuffers = "=25.12.19"
memchr = "2.8.3"
parquet = "58.3.0"
pyo3 = "=0.29.3"
pyo3-build-config = "=0.29.3"
regex = "1.13.1"
rustc-hash = "2.1.3"
serde = "1.0.228"
serde_json = "1.0.151"
sha2 = "0.11"
shardloom-core = { version = "0.6.0", path = "shardloom-core" }
shardloom-exec = { version = "0.6.0", path = "shardloom-exec" }
shardloom-plan = { version = "0.6.0", path = "shardloom-plan" }
shardloom-runtime = { package = "shardloom-cli", version = "0.6.0", path = "shardloom-cli" }
shardloom-vortex = { version = "0.6.0", path = "shardloom-vortex" }
vortex = "0.85"
vortex-zstd = "0.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release-lto]
inherits = "release"

[profile.release-pgo]
inherits = "release-lto"

[profile.release-native-benchmark]
inherits = "release-lto"
