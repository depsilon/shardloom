[workspace]
members = [
  "shardloom-core",
  "shardloom-vortex",
  "shardloom-plan",
  "shardloom-exec",
  "shardloom-cli",
  "shardloom-python",
  "shardloom-contract-tests",
]
exclude = ["vendor/vortex-array", "vendor/vortex-buffer", "vendor/vortex-file", "vendor/vortex-fsst", "vendor/vortex-io", "vendor/vortex-layout", "vendor/vortex-runend", "vendor/vortex-zstd"]
resolver = "2"

[patch.crates-io]
vortex-array = { path = "vendor/vortex-array" }
vortex-buffer = { path = "vendor/vortex-buffer" }
vortex-file = { path = "vendor/vortex-file" }
vortex-fsst = { path = "vendor/vortex-fsst" }
vortex-io = { path = "vendor/vortex-io" }
vortex-layout = { path = "vendor/vortex-layout" }
vortex-runend = { path = "vendor/vortex-runend" }
vortex-zstd = { path = "vendor/vortex-zstd" }

[workspace.package]
version = "0.7.0"
edition = "2024"
description = "Unified data processing engine for SQL and DataFrame workflows (technical preview)."
license = "Apache-2.0"
homepage = "https://shardloom.io"
repository = "https://github.com/depsilon/shardloom"
documentation = "https://github.com/depsilon/shardloom/tree/main/docs"
readme = "README.md"
keywords = ["analytics", "columnar", "vortex", "etl", "no-fallback"]
categories = ["command-line-utilities", "database", "encoding", "science"]
rust-version = "1.96"

[workspace.dependencies]
arrow-array = "=59.3.1"
arrow-buffer = "=59.3.1"
arrow-data = "=59.3.1"
arrow-avro = { version = "=59.3.1", default-features = false, features = ["deflate", "snappy"] }
arrow-flight = { version = "=59.3.1", default-features = false, features = ["flight-sql", "tls-ring"] }
arrow-ipc = "=59.3.1"
arrow-pyarrow = "=59.3.1"
arrow-schema = "=59.3.1"
futures = "0.3.34"
flatbuffers = "=25.12.19"
hashbrown = { version = "0.17.1", default-features = false, features = ["inline-more"] }
memchr = "2.8.3"
parquet = "=59.3.1"
pyo3 = "=0.29.3"
pyo3-build-config = "=0.30.1"
prost = "=0.14.4"
regex = "1.13.1"
rustc-hash = "2.1.3"
serde = "1.0.228"
serde_json = "1.0.151"
sha2 = "0.11"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "codegen", "router", "tls-ring"] }
tonic-prost = "=0.14.6"
shardloom-core = { version = "0.7.0", path = "shardloom-core" }
shardloom-exec = { version = "0.7.0", path = "shardloom-exec" }
shardloom-plan = { version = "0.7.0", path = "shardloom-plan" }
shardloom-runtime = { package = "shardloom-cli", version = "0.7.0", path = "shardloom-cli" }
shardloom-vortex = { version = "0.7.0", path = "shardloom-vortex" }
vortex = { version = "=0.90.0", default-features = false, features = ["files", "zstd"] }
vortex-zstd = "=0.90.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release-lto]
inherits = "release"

[profile.release-pgo]
inherits = "release-lto"

[profile.release-native-benchmark]
inherits = "release-lto"
