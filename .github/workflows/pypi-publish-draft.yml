name: PyPI Trusted Publisher Draft

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Registry channel to publish to after approval."
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi
      publish_approved:
        description: "Type publish-approved to run the selected Trusted Publisher job."
        required: true
        default: "no"
      testpypi_proof_ref:
        description: "Required for channel=pypi; reference to the passed TestPyPI install/uninstall/smoke proof."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.publish_approved == 'publish-approved' }}
    name: Build Python package with bundled CLI (${{ matrix.artifact_suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_suffix: linux
          - os: macos-latest
            artifact_suffix: macos
          - os: windows-latest
            artifact_suffix: windows
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # Swatinem/rust-cache@v2
      - name: Reserve fresh package build directory and resolve Cargo artifacts
        run: |
          python - <<'PY'
          import json, os, subprocess, tempfile
          root = tempfile.mkdtemp(prefix="registry-python-", dir=os.environ["RUNNER_TEMP"])
          metadata = json.loads(subprocess.check_output(["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"]))
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("SHARDLOOM_REGISTRY_BUILD_ROOT=" + root + "\n")
              output.write("SHARDLOOM_REGISTRY_CARGO_TARGET=" + metadata["target_directory"] + "\n")
          PY
      - name: Build shared release CLI
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci-native-python-build.txt
          python scripts/sync_workspace_package_versions.py --check
          python scripts/check_workspace_version_sources.py
          cargo build --locked --release -p shardloom-cli --bin shardloom --features release-user-surfaces
      - name: Build and prove Linux or macOS native wheel
        if: ${{ matrix.artifact_suffix != 'windows' }}
        run: |
          python -m pip download --require-hashes --only-binary=:all: --no-deps -r .github/requirements/ci-native-python.txt --dest "$SHARDLOOM_REGISTRY_BUILD_ROOT/wheelhouse"
          python scripts/build_native_python.py --output-dir "$SHARDLOOM_REGISTRY_BUILD_ROOT/extension" --release > "$SHARDLOOM_REGISTRY_BUILD_ROOT/native-build.json"
          python scripts/prove_native_python_wheel.py --output-dir "$SHARDLOOM_REGISTRY_BUILD_ROOT/proof" --native-library "$SHARDLOOM_REGISTRY_BUILD_ROOT/extension/_native.abi3.so" --cli-binary "$SHARDLOOM_REGISTRY_CARGO_TARGET/release/shardloom" --wheelhouse "$SHARDLOOM_REGISTRY_BUILD_ROOT/wheelhouse" --audit-linux
          python - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from stage_native_python_package import sha
          root = Path(os.environ["SHARDLOOM_REGISTRY_BUILD_ROOT"])
          report = json.loads((root / "proof/report.json").read_text())
          if report["status"] != "passed" or report["uninstall_status"] != "passed":
              raise SystemExit("native release wheel lacks complete installed-package proof")
          wheel = root / "proof/dist" / report["integrity"]["wheel"]
          if sha(wheel) != report["integrity"]["wheel_sha256"]:
              raise SystemExit("verified native wheel changed before release staging")
          dist = root / "dist"
          dist.mkdir()
          copied = Path(shutil.copy2(wheel, dist))
          if sha(copied) != report["integrity"]["wheel_sha256"]:
              raise SystemExit("native wheel changed during release staging")
          PY
      - name: Build Windows Python wheel with bundled CLI
        if: ${{ matrix.artifact_suffix == 'windows' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys
          import zipfile

          sys.path.insert(0, "scripts")
          from release_dry_run_proof import (
              stage_python_package_with_bundled_cli,
          )

          repo_root = Path(".").resolve()
          build_root = Path(os.environ["SHARDLOOM_REGISTRY_BUILD_ROOT"])
          stage_dir = build_root / "windows-package"
          dist_dir = build_root / "dist"
          release_binary = Path(os.environ["SHARDLOOM_REGISTRY_CARGO_TARGET"]) / "release" / (
              "shardloom.exe" if sys.platform == "win32" else "shardloom"
          )
          staged = stage_python_package_with_bundled_cli(repo_root, stage_dir, release_binary)
          if staged["returncode"] != 0:
              raise SystemExit(staged.get("stderr") or staged.get("stdout"))
          subprocess.run([sys.executable, "-m", "pip", "wheel", "--no-build-isolation",
                          "--no-deps", "--no-index", "--wheel-dir", str(dist_dir),
                          str(stage_dir)], check=True)
          wheels = sorted(dist_dir.glob("shardloom-*.whl"))
          if len(wheels) != 1:
              raise SystemExit("expected exactly one platform wheel")
          for wheel in wheels:
              if wheel.name.endswith("-py3-none-any.whl"):
                  raise SystemExit(f"bundled CLI wheel must not be universal: {wheel.name}")
              with zipfile.ZipFile(wheel) as archive:
                  wheel_metadata = next(
                      name for name in archive.namelist() if name.endswith(".dist-info/WHEEL")
                  )
                  wheel_text = archive.read(wheel_metadata).decode("utf-8")
              if "Root-Is-Purelib: false" not in wheel_text:
                  raise SystemExit(f"bundled CLI wheel must be platform-specific: {wheel.name}")
          PY
      - name: Upload native installed-package proof
        if: ${{ always() && matrix.artifact_suffix != 'windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        with:
          name: native-registry-proof-${{ matrix.artifact_suffix }}
          path: |
            ${{ env.SHARDLOOM_REGISTRY_BUILD_ROOT }}/native-build.json
            ${{ env.SHARDLOOM_REGISTRY_BUILD_ROOT }}/proof/report.json
            ${{ env.SHARDLOOM_REGISTRY_BUILD_ROOT }}/proof/integration.json
            ${{ env.SHARDLOOM_REGISTRY_BUILD_ROOT }}/proof/*.log
          if-no-files-found: error
      - name: Upload Python dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        with:
          name: python-dist-${{ matrix.artifact_suffix }}
          path: ${{ env.SHARDLOOM_REGISTRY_BUILD_ROOT }}/dist/*.whl
          if-no-files-found: error
      - name: Build clean Python sdist
        if: ${{ matrix.artifact_suffix == 'linux' }}
        run: |
          python -m build --sdist --no-isolation --outdir "$SHARDLOOM_REGISTRY_BUILD_ROOT/sdist" python
      - name: Upload Python sdist artifact
        if: ${{ matrix.artifact_suffix == 'linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        with:
          name: python-dist-sdist
          path: ${{ env.SHARDLOOM_REGISTRY_BUILD_ROOT }}/sdist/*.tar.gz
          if-no-files-found: error

  publish-testpypi:
    needs: build
    if: ${{ inputs.publish_approved == 'publish-approved' && inputs.channel == 'testpypi' }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8
        with:
          pattern: python-dist-*
          path: python/dist
          merge-multiple: true
      - name: Publish to TestPyPI with Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          repository-url: https://test.pypi.org/legacy/

  validate-pypi-prior-proof:
    needs: build
    if: ${{ inputs.publish_approved == 'publish-approved' && inputs.channel == 'pypi' && inputs.testpypi_proof_ref != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Validate prior TestPyPI proof transcript
        env:
          TESTPYPI_PROOF_REF: ${{ inputs.testpypi_proof_ref }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          sys.path.insert(0, "scripts")
          from release_report_utils import workspace_package_version

          def resolve_python_package_version() -> str:
              return workspace_package_version(pathlib.Path("."))

          proof_ref = pathlib.PurePosixPath(
              pathlib.Path(os.environ["TESTPYPI_PROOF_REF"]).as_posix()
          )
          if proof_ref.is_absolute() or ".." in proof_ref.parts:
              raise SystemExit("testpypi_proof_ref must be a repository-relative path")
          proof_path = pathlib.Path(proof_ref)
          proof = json.loads(proof_path.read_text(encoding="utf-8"))
          expected_version = resolve_python_package_version()
          required = {
              "schema_version": "shardloom.python_registry_package_proof.v1",
              "proof_status": "passed",
              "channel_id": "testpypi",
              "package_name": "shardloom",
              "package_version": expected_version,
              "install_transcript_status": "passed",
              "smoke_check_status": "passed",
              "uninstall_transcript_status": "passed",
              "fallback_attempted": False,
              "external_engine_invoked": False,
              "registry_upload_attempted_by_this_tool": False,
              "publication_attempted_by_this_tool": False,
              "package_channel_submission_attempted_by_this_tool": False,
              "cli_binary_required_for_clean_registry_smoke": True,
              "cli_binary_available": True,
              "cli_binary_smoke_source": "approved_release_or_local_artifact",
          }
          mismatches = [
              f"{key}={proof.get(key)!r} expected {expected!r}"
              for key, expected in required.items()
              if proof.get(key) != expected
          ]
          if not isinstance(proof.get("cli_binary_ref"), str) or not proof["cli_binary_ref"]:
              mismatches.append("cli_binary_ref missing")
          if mismatches:
              raise SystemExit("invalid TestPyPI proof: " + "; ".join(mismatches))
          PY

  publish:
    needs:
      - build
      - validate-pypi-prior-proof
    if: ${{ inputs.publish_approved == 'publish-approved' && inputs.channel == 'pypi' && inputs.testpypi_proof_ref != '' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8
        with:
          pattern: python-dist-*
          path: python/dist
          merge-multiple: true
      - name: Publish to PyPI with Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
