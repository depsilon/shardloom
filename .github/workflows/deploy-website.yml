name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "wrangler.jsonc"
      - "wrangler.toml"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static website to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout website assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            website
            wrangler.jsonc
            wrangler.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials and static asset size budget
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is required to deploy website/."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID repository variable or secret is required to deploy website/."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path

          max_bytes = 25 * 1024 * 1024
          root = Path("website")
          if not root.is_dir():
              raise SystemExit("website directory is missing after sparse checkout")

          oversized = []
          file_count = 0
          total_bytes = 0
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  size = path.stat().st_size
                  file_count += 1
                  total_bytes += size
                  if size > max_bytes:
                      oversized.append((str(path), size))

          print(f"Verified {file_count} files under website/ ({total_bytes} bytes total)")
          if oversized:
              for rel_path, size in oversized:
                  print(
                      f"::error::{rel_path} is {size} bytes (> {max_bytes} byte Cloudflare Workers static asset limit)"
                  )
              raise SystemExit(1)
          PY

      - name: Deploy website to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
