    needs: [ci-work-shaping, python-native-wheel-linux, python-native-wheel-macos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - name: Require every platform and interpreter proof
        env:
          PACKAGE_NEEDS: ${{ toJSON(needs) }}
        run: python -c 'import json,os; assert all(row["result"] == "success" for row in json.loads(os.environ["PACKAGE_NEEDS"]).values())'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8
