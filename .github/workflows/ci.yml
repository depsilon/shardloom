  python-compatibility-matrix:
    name: Python compatibility (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    if: ${{ needs.ci-work-shaping.result == 'success' && contains(fromJSON(needs.ci-work-shaping.outputs.selected_jobs || '[]'), 'python-compatibility-matrix') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: py310_ubuntu
            os: ubuntu-latest
            python-version: "3.10"
          - lane: py311_ubuntu
            os: ubuntu-latest
            python-version: "3.11"
          - lane: py312_ubuntu
            os: ubuntu-latest
            python-version: "3.12"
          - lane: py313_ubuntu
            os: ubuntu-latest
            python-version: "3.13"
          - lane: py311_macos
            os: macos-latest
            python-version: "3.11"
          - lane: py311_windows
            os: windows-latest
            python-version: "3.11"
    needs: [ci-work-shaping]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python build tooling
        run: python -m pip install --require-hashes -r .github/requirements/ci-python-build.txt
      - name: Python compile check
        run: python -m compileall -q python/src scripts examples benchmarks/traditional_analytics
      - name: Python package build
        run: python -m build python
      # Python-only wheels do not compile the CLI that release wheels bundle.
      # Exercise the real Windows release features before a tag is published.
      - name: Install Rust for Windows native package validation
        if: ${{ matrix.os == 'windows-latest' }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Windows native package validation
        if: ${{ matrix.os == 'windows-latest' }}
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2
        with:
          key: windows-release-user-surfaces
      - name: Build Windows native release CLI
        if: ${{ matrix.os == 'windows-latest' }}
        run: cargo build --release -p shardloom-cli --bin shardloom --features release-user-surfaces
      - name: Windows native CLI version smoke
        if: ${{ matrix.os == 'windows-latest' }}
        run: ./target/release/shardloom.exe --version
      - name: Windows native resource admission refusal
        if: ${{ matrix.os == 'windows-latest' }}
        run: cargo test --release -p shardloom-cli --test non_unix_resource_admission --features release-user-surfaces
      - name: Python compatibility lane report
        run: python scripts/write_release_compatibility_lane_report.py --lane ${{ matrix.lane }} --surface python --python-version ${{ matrix.python-version }} --os-name ${{ matrix.os }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        if: always()
        with:
          name: release-compatibility-${{ matrix.lane }}
          path: target/release-compatibility/${{ matrix.lane }}.json
          if-no-files-found: ignore
          retention-days: 14

