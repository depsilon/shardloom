      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2
        with:
          key: native-package-macos-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
      - name: Install pinned native wheel build tooling
        run: python -m pip install --require-hashes -r .github/requirements/ci-native-python-build.txt
      - name: Build ordinary wheel and separate observation extension
        run: python scripts/ci_native_package.py build --output "$RUNNER_TEMP/native-package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        if: always()
