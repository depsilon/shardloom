name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: "1"

jobs:
  ci-work-shaping:
    name: CI work shaping plan
    outputs:
      selected_jobs: ${{ steps.execution.outputs.selected_jobs }}
      full_validation: ${{ steps.execution.outputs.full_validation }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2
        with:
          key: ci-work-shaping-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
      - name: Collect changed files
        shell: bash
        run: |
          mkdir -p target
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --no-renames --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > target/ci-work-shaping-changed-files.txt
            echo "SHARDLOOM_CI_WORK_SHAPING_MODE=pull_request" >> "$GITHUB_ENV"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --no-renames --name-only "${{ github.event.before }}" "${{ github.sha }}" > target/ci-work-shaping-changed-files.txt
            echo "SHARDLOOM_CI_WORK_SHAPING_MODE=merge" >> "$GITHUB_ENV"
          else
            git ls-files > target/ci-work-shaping-changed-files.txt
            echo "SHARDLOOM_CI_WORK_SHAPING_MODE=merge" >> "$GITHUB_ENV"
          fi
      - name: Generate CI work shaping plan
        run: |
          cargo run -q -p shardloom-cli -- ci-work-shaping-plan \
            --mode "$SHARDLOOM_CI_WORK_SHAPING_MODE" \
            --changed-paths-file target/ci-work-shaping-changed-files.txt \
            --format json > target/ci-work-shaping-plan.json
      - name: Apply conservative execution selection
        id: execution
        env:
          CI_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_REVISION: ${{ github.sha }}
        run: |
          python scripts/ci_execution_plan.py plan --plan target/ci-work-shaping-plan.json \
            --base "$CI_BASE_REVISION" --revision "$CI_HEAD_REVISION" \
            --mode "$SHARDLOOM_CI_WORK_SHAPING_MODE" --output target/ci-execution-plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        if: always()
        with:
          name: ci-work-shaping-evidence
          path: |
            target/ci-work-shaping-plan.json
            target/ci-work-shaping-changed-files.txt
            target/ci-execution-plan.json
          if-no-files-found: ignore
          retention-days: 14

  rust-baseline:
    name: Rust baseline (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: fmt
            command: cargo fmt --all -- --check
          - lane: clippy
            command: cargo clippy --workspace --all-targets -- -D warnings
          - lane: test
            command: cargo test --workspace --all-targets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2
        with:
          key: rust-baseline-${{ matrix.lane }}
      - name: Run Rust baseline lane
        run: ${{ matrix.command }}

  rust-feature-matrix:
    name: Rust feature matrix (${{ matrix.lane }})
    runs-on: ubuntu-latest
    if: ${{ needs.ci-work-shaping.result == 'success' && contains(fromJSON(needs.ci-work-shaping.outputs.selected_jobs || '[]'), 'rust-feature-matrix') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: default_features
            command: cargo check --workspace
          - lane: all_features
            command: cargo check --workspace --all-features
          - lane: no_default_features
            command: cargo check --workspace --no-default-features
          - lane: upstream_vortex
            command: cargo check -p shardloom-vortex --features upstream-vortex
          - lane: vortex_file_io
            command: cargo check -p shardloom-vortex --features vortex-file-io
          - lane: vortex_local_primitives
            command: cargo check -p shardloom-vortex --features vortex-local-primitives
          - lane: vortex_encoded_read_spike
            command: cargo check -p shardloom-vortex --features vortex-encoded-read-spike
          - lane: release_user_surfaces
            command: cargo check -p shardloom-vortex --features release-user-surfaces
          - lane: native_vortex_observation
            command: |
              cargo test --locked -p shardloom-vortex --lib --features release-user-surfaces,output-window-observation output_window_observation::tests
              cargo test --locked -p shardloom-vortex --lib --features release-user-surfaces,output-window-observation credit_window::tests
          - lane: synthetic_spill_resources
            command: |
              cargo test -p shardloom-exec --lib --features spill-payload-fs spill_payload::tests -- --test-threads=1
              cargo test -p shardloom-vortex --lib --features shardloom-exec/spill-payload-fs bounded_execution::tests -- --test-threads=1
              cargo test -p shardloom-cli --test required_execution_resources --features shardloom-exec/spill-payload-fs -- --test-threads=1
          - lane: preparation_resource_profile
            command: cargo test -p shardloom-cli --all-targets --no-default-features --features vortex-write
          - lane: native_release_clippy
            command: cargo clippy -p shardloom-cli -p shardloom-vortex --all-targets --features release-user-surfaces -- -D warnings
          - lane: packaging_deployment
            command: cargo test -p shardloom-contract-tests --test conda_packaging_recipes
    needs: [ci-work-shaping]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2
        with:
          key: feature-${{ matrix.lane }}
      - name: Run feature lane
        run: ${{ matrix.command }}

  native-test-build:
    name: Build checked optimized native tests
    runs-on: ubuntu-24.04
    if: ${{ needs.ci-work-shaping.result == 'success' && contains(fromJSON(needs.ci-work-shaping.outputs.selected_jobs || '[]'), 'native-test-build') }}
    needs: [ci-work-shaping]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2
        with:
          key: native-test-ci-native-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
      - name: Build one native test executable and complete inventory
        run: |
          python scripts/ci_build_artifact.py build --product native-tests --directory "$RUNNER_TEMP/ci-native-tests"
          python scripts/ci_native_tests.py prepare --bundle "$RUNNER_TEMP/ci-native-tests"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        with:
          name: native-test-executable
          path: ${{ runner.temp }}/ci-native-tests
          compression-level: 1
          if-no-files-found: error
          retention-days: 14

  native-test-partitions:
    name: Native test partition (${{ matrix.partition }})
    runs-on: ubuntu-24.04
    if: ${{ needs.ci-work-shaping.result == 'success' && contains(fromJSON(needs.ci-work-shaping.outputs.selected_jobs || '[]'), 'native-test-partitions') }}
    needs: [ci-work-shaping, native-test-build]
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8
        with:
          name: native-test-executable
          path: target/ci-native-tests
      - name: Execute assigned tests with original Rust harness
        run: python scripts/ci_native_tests.py run --bundle target/ci-native-tests --partition ${{ matrix.partition }} --output target/ci-native-results/${{ matrix.partition }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        if: always()
        with:
          name: native-test-partition-${{ matrix.partition }}
          path: target/ci-native-results/${{ matrix.partition }}
          if-no-files-found: error
          retention-days: 14

  patched-provider-tests:
    name: Patched Vortex providers (${{ matrix.group }})
    runs-on: ubuntu-24.04
    if: ${{ needs.ci-work-shaping.result == 'success' && contains(fromJSON(needs.ci-work-shaping.outputs.selected_jobs || '[]'), 'patched-provider-tests') }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/providers
    strategy:
      fail-fast: false
      matrix:
        group: [arrays, io, buffer]
    needs: [ci-work-shaping]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/providers
          key: providers-${{ matrix.group }}-${{ hashFiles('.github/provider-locks/*.lock', 'vendor/*/Cargo.toml') }}
      - name: Test and lint exact patched-provider configurations
        run: python scripts/ci_provider_tests.py --group ${{ matrix.group }} --output target/provider-evidence/${{ matrix.group }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        if: always()
        with:
          name: provider-evidence-${{ matrix.group }}
          path: target/provider-evidence/${{ matrix.group }}
          if-no-files-found: error
          retention-days: 14

  native-tests:
    name: Rust feature matrix (native_vortex_tests)
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.ci-work-shaping.result == 'success' && contains(fromJSON(needs.ci-work-shaping.outputs.selected_jobs || '[]'), 'native-tests') }}
    needs: [ci-work-shaping, native-test-build, native-test-partitions, patched-provider-tests, rust-feature-matrix]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Reject failed or missing native producers
        env:
          NATIVE_NEEDS: ${{ toJSON(needs) }}
        run: python -c 'import json,os; assert all(row["result"] == "success" for row in json.loads(os.environ["NATIVE_NEEDS"]).values())'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8
        with:
          name: native-test-executable
          path: target/ci-native-tests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8
        with:
          pattern: native-test-partition-*
          path: target/ci-native-results
      - name: Prove complete native test ownership and results
        run: python scripts/ci_native_tests.py aggregate --bundle target/ci-native-tests --output target/ci-native-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        with:
          name: native-test-coverage
          path: target/ci-native-results/coverage.json
          if-no-files-found: error
          retention-days: 14

  native-cli-build-debug:
    name: Rust feature matrix (native_public_surface_tests)
    runs-on: ubuntu-24.04
    if: ${{ needs.ci-work-shaping.result == 'success' && contains(fromJSON(needs.ci-work-shaping.outputs.selected_jobs || '[]'), 'native-cli-build-debug') }}
    needs: [ci-work-shaping]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2
        with:
          key: native-cli-debug-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
      - name: Preserve ordinary debug native public-surface tests
        run: cargo test --locked -p shardloom-cli --lib --bin shardloom --test vortex_prepare --test public_memory_inputs --test public_workflow_route --test resident_worker --features release-user-surfaces
      - name: Build and seal exact CLI configuration
        run: python scripts/ci_build_artifact.py build --product cli-debug --directory "$RUNNER_TEMP/ci-cli-debug"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        with:
          name: native-cli-debug-linux
          path: ${{ runner.temp }}/ci-cli-debug
          compression-level: 1
          if-no-files-found: error
          retention-days: 14

  native-cli-build-release:
    name: Native release CLI build
    runs-on: ubuntu-24.04
    if: ${{ needs.ci-work-shaping.result == 'success' && contains(fromJSON(needs.ci-work-shaping.outputs.selected_jobs || '[]'), 'native-cli-build-release') }}
    needs: [ci-work-shaping]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2
        with:
          key: native-cli-release-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
      - name: Build and seal exact CLI configuration
        run: python scripts/ci_build_artifact.py build --product cli-release --directory "$RUNNER_TEMP/ci-cli-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        with:
          name: native-cli-release-linux
          path: ${{ runner.temp }}/ci-cli-release
          compression-level: 1
          if-no-files-found: error
          retention-days: 14

  rust-msrv:
    name: Rust MSRV validation
    runs-on: ubuntu-latest
    if: ${{ needs.ci-work-shaping.result == 'success' && contains(fromJSON(needs.ci-work-shaping.outputs.selected_jobs || '[]'), 'rust-msrv') }}
    needs: [ci-work-shaping]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - name: Derive workspace version env
        run: python scripts/write_ci_version_env.py --github-env "$GITHUB_ENV"
      - name: Install Rust MSRV
        run: |
          rustup toolchain install "$SHARDLOOM_RUST_MSRV_TOOLCHAIN" --profile minimal
          rustup default "$SHARDLOOM_RUST_MSRV_TOOLCHAIN"
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # Swatinem/rust-cache@v2
        with:
          key: rust-msrv-${{ hashFiles('Cargo.toml') }}
      - name: Rust MSRV check
        run: cargo check --workspace --no-default-features
      - name: Rust MSRV native user surfaces
        run: cargo check --workspace --all-targets --features release-user-surfaces
      - name: Rust MSRV lane report
        run: |
          python scripts/write_release_compatibility_lane_report.py \
            --lane "$SHARDLOOM_RUST_MSRV_LANE" \
            --surface rust \
            --rust-toolchain "$SHARDLOOM_RUST_MSRV_TOOLCHAIN" \
            --os-name ubuntu-latest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        if: always()
        with:
          name: release-compatibility-rust-msrv
          path: target/release-compatibility/rust_msrv_*.json
          if-no-files-found: ignore
          retention-days: 14

  python-test-shards:
    name: Python test shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - core
          - front_door_benchmark_publication
          - release_scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Python test shard
        run: python scripts/run_python_test_shard.py --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        if: always()
        with:
          name: python-test-shard-${{ matrix.shard }}
          path: target/python-test-shards/${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 14

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    needs:
      - python-test-shards
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Reuse Python test shard evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8
        with:
          pattern: python-test-shard-*
          path: target/python-test-shards
          merge-multiple: true
      - name: Python compile check
        run: python -m compileall -q python/src python/tests scripts examples benchmarks/traditional_analytics
      - name: Local UAT storage safety
        run: python -B -m unittest discover -s scripts -p test_local_uat_storage.py -v
      - name: ClickBench result and timing harness
        run: python -B -m unittest discover -s scripts -p 'test_*clickbench*.py' -v
      - name: Resident public call path harness
        run: python -B -m unittest discover -s scripts -p test_resident_call_path_uat.py -v
      - name: Held-out native operator harness
        run: python -B -m unittest discover -s scripts -p test_heldout_operator_uat.py -v
      - name: Native output acceptance harness
        run: python -B -m unittest discover -s scripts -p test_native_output_uat.py -v
      - name: Native regression family coverage and supervision
        run: python -B -m unittest discover -s scripts -p test_native_relational_suite.py -v
      - name: Parquet completion portable evidence and corruption controls
        run: python -B -m unittest discover -s scripts -p test_parquet_demand_completion_packet.py -v
      - name: Temporal fidelity portable evidence and corruption controls
        run: python -B -m unittest discover -s scripts -p test_native_temporal_fidelity_packet.py -v
      - name: Rich bounded retention portable evidence and corruption controls
        run: python -B -m unittest discover -s scripts -p test_rich_bounded_retention_packet.py -v
      - name: Shared key lookup portable evidence and corruption controls
        run: python -B -m unittest discover -s scripts -p test_shared_key_lookup_packet.py -v
      - name: Shared numeric values portable evidence and corruption controls
        run: python -B -m unittest discover -s scripts -p test_shared_numeric_values_packet.py -v
      - name: Shared performance evidence corruption controls
        run: python -B -m unittest discover -s scripts -p test_shared_performance_packet.py -v
      - name: Shared performance complete saved-result replay
        run: python -B scripts/verify_shared_performance_packet.py docs/benchmarks/evidence/native-shared-performance-2026-10-30
      - name: Shared performance follow-through corruption controls
        run: python -B -m unittest discover -s scripts -p test_shared_followthrough_packet.py -v
      - name: Shared performance follow-through complete saved-result replay
        run: python -B scripts/verify_shared_followthrough_packet.py docs/benchmarks/evidence/native-shared-followthrough-2026-10-30
      - name: Rejected single-predicate mask corruption controls
        run: python -B -m unittest discover -s scripts -p test_single_predicate_mask_packet.py -v
      - name: Rejected single-predicate mask complete saved-result replay
        run: python -B scripts/verify_single_predicate_mask_packet.py docs/benchmarks/evidence/native-single-predicate-masks-2026-10-30
      - name: Grouped attribution rejection controls
        run: python -B -m unittest discover -s scripts -p test_native_grouped_cost_diagnostic.py -v
      - name: Grouped attribution complete saved-result replay
        run: python -B scripts/verify_grouped_cost_packet.py docs/benchmarks/evidence/native-grouped-cost-2026-10-31
      - name: Compact grouped-state corruption controls
        run: python -B -m unittest discover -s scripts -p test_grouped_state_packet.py -v
      - name: Compact grouped-state complete saved-result replay
        run: python -B scripts/verify_grouped_state_packet.py docs/benchmarks/evidence/native-grouped-state-access-2026-10-31
      - name: Rejected adjacent-read corruption controls
        run: python -B -m unittest discover -s scripts -p test_adjacent_reads_packet.py -v
      - name: Rejected adjacent-read complete saved-result replay
        run: python -B scripts/verify_adjacent_reads_packet.py docs/benchmarks/evidence/native-adjacent-parquet-reads-2026-10-31
      - name: Ordered-input corruption controls
        run: python -B -m unittest discover -s scripts -p test_ordered_input_packet.py -v
      - name: Ordered-input complete saved-result replay
        run: python -B scripts/verify_ordered_input_packet.py docs/benchmarks/evidence/native-ordered-inputs-2026-10-31
      - name: Rejected typed-ordering corruption controls
        run: python -B -m unittest discover -s scripts -p test_typed_ordering_packet.py -v
      - name: Rejected typed-ordering complete saved-result replay
        run: python -B scripts/verify_typed_ordering_packet.py docs/benchmarks/evidence/native-typed-ordering-2026-10-31
      - name: Native performance batch and retained composition corruption controls
        run: python -B -m unittest discover -s scripts -p 'test_native_performance_batch*_packet.py' -v
      - name: Combined native performance batch complete saved-result replay
        run: python -B scripts/verify_native_performance_batch_packet.py docs/benchmarks/evidence/native-performance-batch-2026-10-31
      - name: Merge Python test shard evidence
