version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      vortex-upstream:
        patterns:
          - "vortex"
          - "vortex-*"
      structured-format-stack:
        patterns:
          - "arrow-*"
          - "parquet"
          - "orc-rust"
      rust-runtime-utilities:
        patterns:
          - "futures"
          - "futures-*"
          - "memchr"
          - "regex"
          - "regex-*"
          - "rustc-hash"

  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ci-security-actions:
        patterns:
          - "*"
