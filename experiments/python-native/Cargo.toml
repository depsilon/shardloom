[package]
name = "shardloom-native-experiment"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

# Deliberately excluded from the production workspace and package channels.
[workspace]

[lib]
name = "_shardloom_native_experiment"
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
pyo3 = { version = "=0.29.2", default-features = false, features = ["macros"] }
shardloom-core = { path = "../../shardloom-core" }
shardloom-plan = { path = "../../shardloom-plan" }
shardloom-vortex = { path = "../../shardloom-vortex", features = ["vortex-local-primitives"] }

[build-dependencies]
pyo3-build-config = "=0.29.2"
